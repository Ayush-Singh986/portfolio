    <section class="panel">
      <div class="eyebrow">05 // terminal</div>
      <h2>Try it.</h2>
      <div class="accent-bar"></div>
      <div class="term" id="term">
        <div class="line">ayush@portfolio:~$ <span class="prompt">welcome.</span> type "help" to see available commands.</div>
      </div>
      <div class="term-input-row">
        <span class="prompt mono">ayush@portfolio:~$</span>
        <input id="termInput" type="text" autocomplete="off" spellcheck="false" aria-label="Terminal command input">
      </div>
      <div class="term-hint">Try: help · whoami · skills · experience · projects · contact · clear</div>
    </section>

    <div class="site-footer"><span class="d"></span>© 2026 Ayush Singh · all systems operational</div>
  </main>
</div>

<script src="main.js"></script>
<script>
(function(){
  var term = document.getElementById('term');
  var input = document.getElementById('termInput');

  var commands = {
    help: 'Available commands: whoami, skills, experience, projects, contact, clear',
    whoami: 'Ayush Singh — Managed Services Consultant / DevOps Engineer, Bengaluru, IN.',
    skills: 'AWS · Docker · Kubernetes · Terraform · Jenkins · Argo CD · Prometheus · Grafana · Apache Airflow · Java · Python · JavaScript',
    experience: 'Gresham Technology — Managed Services Consultant (2026–Present). Client engagements: EXP, BNS, LBP, ZTS. See /resume.html for the full breakdown.',
    projects: '1. AI-Driven DevSecOps CI/CD & GitOps Automation\n2. GitOps Microservices Platform — EKS Auto Mode\nSee /portfolio.html for details.',
    contact: 'ayush054483@gmail.com · linkedin.com/in/ayush-singh-59469b310 · github.com/Ayush-Singh986'
  };

  function printLine(text, cls) {
    var div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    term.appendChild(div);
    term.scrollTop = term.scrollHeight;
  }

  function runCommand(raw) {
    var cmd = raw.trim().toLowerCase();
    printLine('ayush@portfolio:~$ ' + raw);
    if (!cmd) return;
    if (cmd === 'clear') { term.innerHTML = ''; return; }
    if (commands[cmd]) { printLine(commands[cmd]); return; }
    printLine('command not found: "' + raw + '" — type "help" for a list.');
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && input.value.trim() !== '') {
      runCommand(input.value);
      input.value = '';
    }
  });

  document.querySelector('.term-input-row').addEventListener('click', function () {
    input.focus();
  });
})();
</script>
</body>
